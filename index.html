<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسين | Elite Mini App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #f1f1f1; overflow-x: hidden; }
        
        /* الهيدر الملكي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid #222; position: fixed; top: 0; width: 100%; z-index: 1000; backdrop-filter: blur(10px); }
        .logo { font-size: 16px; font-weight: 800; color: #d4af37; letter-spacing: 0.5px; }
        
        /* الأقسام الأفقية */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 80px 15px 15px 15px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: linear-gradient(135deg, #d4af37, #aa820a); color: #000; font-weight: bold; border-color: #d4af37; }

        /* حاوية الفيديو (نمط تيك توك) */
        .video-container { position: relative; width: 100%; height: 70vh; background: #000; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .video-placeholder { width: 100%; height: 100%; object-fit: cover; background: #121212; display: flex; justify-content: center; align-items: center; color: #555; font-size: 15px; }
        
        /* أزرار التفاعل الجانبية */
        .actions { position: absolute; bottom: 30px; left: 15px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .action-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; backdrop-filter: blur(5px); }

        /* الأزرار المائية الملونة للتواصل */
        .social-section { padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
        .water-btn { display: block; padding: 12px; border-radius: 12px; font-weight: bold; text-decoration: none; color: white; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        .telegram-btn { background: linear-gradient(135deg, #0088cc, #005580); border: 1px solid rgba(0, 136, 204, 0.4); }
        .instagram-btn { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: 1px solid rgba(220, 39, 67, 0.4); }
        .report-btn { background: linear-gradient(135deg, #333, #1a1a1a); border: 1px solid #444; color: #ff5555; }

        /* حقوق الملكية */
        .footer-branding { text-align: center; padding: 20px; font-size: 12px; color: #777; border-top: 1px solid #1a1a1a; }
        .footer-branding span { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="logo">⚡ IRAQ TIKTOK ELITE</div>
        <div style="font-size: 13px; color: #888;">إدارة: حسين</div>
    </div>

    <!-- شريط الأقسام -->
    <div class="categories">
        <button class="cat-btn active">🔥 ترند اليوم</button>
        <button class="cat-btn">⚽ رياضة</button>
        <button class="cat-btn">😂 كوميديا</button>
        <button class="cat-btn">🚗 سيارات</button>
        <button class="cat-btn">🎵 فونك</button>
    </div>

    <!-- عرض الفيديو -->
    <div class="video-container">
        <div class="video-placeholder">
            [ جاري عرض الفيديوهات الحارة - تيك توك ستايل ]
        </div>
        
        <!-- تفاعلات الشاشة -->
        <div class="actions">
            <div class="action-btn">❤️</div>
            <div class="action-btn">💾</div>
            <div class="action-btn">↗️</div>
        </div>
    </div>

    <!-- أزرار التواصل المائية والملونة -->
    <div class="social-section">
        <a href="https://t.me/IME44" target="_blank" class="water-btn telegram-btn">
            📢 قناة التليجرام والتواصل (IME44)
        </a>
        <a href="https://instagram.com/kw8c" target="_blank" class="water-btn instagram-btn">
            📸 انستجرام الرسمي (kw8c)
        </a>
        <a href="https://t.me/IME44" target="_blank" class="water-btn report-btn">
            ⚠️ الإبلاغ عن مشكلة أو فيديو مخالف
        </a>
    </div>

    <!-- قسم الحقوق الملكية الفخمة -->
    <div class="footer-branding">
        تم التطوير والهندسة بواسطة <span>حسين</span> 👑<br>
        جميع الحقوق محفوظة © 2026
    </div>

</body>
</html>
