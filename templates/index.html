<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
  .search-box { display: flex; gap: 5px; margin: 10px 0; position: sticky; top: 0; background: #000; padding: 10px; z-index: 10; }
  .search-box input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #222; color: #fff; outline: none; }
  .search-box button { padding: 12px 15px; border-radius: 10px; border: none; background: #ff0050; color: #fff; font-weight: bold; cursor: pointer; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .cats::-webkit-scrollbar { display: none; }
  .cats span { background: #222; padding: 6px 14px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; }
  .cats span.active { background: #ff0050; }
  .video { background: #111; margin: 15px 0; border-radius: 15px; overflow: hidden; padding: 12px; }
  .video h3 { margin: 5px 0; font-size: 16px; }
  .video small { color: #888; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button { background: #222; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .fly { animation: fly 0.8s forwards; }
  @keyframes fly { 0% { transform: scale(1); } 100% { transform: scale(2) translateY(-100px); opacity: 0; } }
</style>
</head>
<body>

<div class="search-box">
  <input id="searchInput" placeholder="ابحث... مثلا حب، ضحك">
  <button onclick="searchOnline()">بحث</button>
</div>

<div class="cats" id="cats">
  <span class="active" onclick="filterCat(this,'الكل')">الكل</span>
  <span onclick="filterCat(this,'ترند')">ترند</span>
  <span onclick="filterCat(this,'مضحك')">مضحك</span>
  <span onclick="filterCat(this,'حب')">حب</span>
  <span onclick="filterCat(this,'حزين')">حزين</span>
  <span onclick="filterCat(this,'رياضي')">رياضي</span>
</div>

<div id="videos"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// ذاكرة المشاهدة - علمود ما يعيد نفس الفيديو نهائياً
let watched = JSON.parse(localStorage.getItem('watched') || '[]');
let allVideos = JSON.parse(localStorage.getItem('allVideos') || '[]');

// فيديوهات تجريبية - بعدين تسحب من قناتك مباشرة
if(allVideos.length === 0){
  allVideos = [
    {title:"فيديو حب - ترند اليوم", cat:"حب", url:"https://tiktok.com/@test/video/1"},
    {title:"مقلب مضحك يموت", cat:"مضحك", url:"https://tiktok.com/@test/video/2"},
    {title:"هدف رياضي خرافي", cat:"رياضي", url:"https://tiktok.com/@test/video/3"},
    {title:"حزين والدمعة بعيني", cat:"حزين", url:"https://tiktok.com/@test/video/4"},
  ];
  localStorage.setItem('allVideos', JSON.stringify(allVideos));
}

function render(list){
  let html = "";
  list.forEach(v => {
    if(watched.includes(v.title)) return; // يتخطى الفيديوهات اللي شافها المستخدم
    html += `<div class="video" data-cat="${v.cat}">
      <h3>${v.title}</h3>
      <small>#${v.cat}</small>
      <div class="actions">
        <button onclick="like(this)">❤️ لايك</button>
        <button onclick="shareVideo('${v.title}','${v.url}')">↗️ مشاركة</button>
        <button onclick="window.open('${v.url}')">▶️ فتح</button>
      </div>
    </div>`;
  });
  document.getElementById('videos').innerHTML = html || "<p style='text-align:center;margin-top:30px;color:#888;'>ماكو نتائج.. جرب كلمة ثانية أو خلصت الفيديوهات!</p>";
}
render(allVideos);

// 1. ميزة البحث
function searchOnline(){
  let q = document.getElementById('searchInput').value.trim();
  if(!q) return render(allVideos);
  let filtered = allVideos.filter(v => v.title.includes(q) || v.cat.includes(q));
  if(filtered.length === 0){
     let ddg = `https://duckduckgo.com/?q=site%3Atiktok.com+${encodeURIComponent(q)}`;
     window.open(ddg, "_blank");
  }
  render(filtered);
}

// بحث فوري أثناء الكتابة
document.getElementById('searchInput').addEventListener('input', searchOnline);

// 2. فلترة الأقسام
function filterCat(el, cat){
  document.querySelectorAll('.cats span').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  if(cat === 'الكل') render(allVideos);
  else render(allVideos.filter(v => v.cat === cat));
}

// 3. ميزة القلب الطاير + حفظ المشاهدة
function like(el){
  el.classList.add('fly');
  let title = el.closest('.video').querySelector('h3').innerText;
  if(!watched.includes(title)){
    watched.push(title);
    localStorage.setItem('watched', JSON.stringify(watched));
  }
  setTimeout(() => { el.classList.remove('fly'); render(allVideos); }, 800);
}

// 4. مشاركة الفيديو داخل تليكرام
function shareVideo(title, url){
  let text = `شوف هذا الفيديو من إمبراطورية الميني آب 😍\n${title}\n${url}`;
  let shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
  
  if(tg.openTelegramLink){
    tg.openTelegramLink(shareUrl);
  } else {
    window.open(shareUrl, "_blank");
  }
}
</script>
</body>
</html>
